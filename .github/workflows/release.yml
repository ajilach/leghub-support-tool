name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  packages: write

jobs:
  check-version:
    name: Check for version change
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare Cargo.toml version to latest release
        id: check
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Cargo.toml version: $VERSION"

          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1 || true)
          echo "Latest release tag: $LATEST_TAG"

          if [ "v$VERSION" != "$LATEST_TAG" ]; then
            echo "Version changed — will release v$VERSION"
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "Version unchanged — skipping release"
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-release:
    name: Create Release
    needs: [check-version]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ needs.check-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ needs.check-version.outputs.version }}
          git push origin v${{ needs.check-version.outputs.version }}

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          release_name: Release v${{ needs.check-version.outputs.version }}
          draft: false
          prerelease: false

  build-and-upload:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            package_types: macos
            artifact: leghub-support-tool-macos-aarch64.dmg
            content_type: application/x-apple-diskimage
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package_types: deb
            artifact: leghub-support-tool-linux-x86_64.deb
            content_type: application/vnd.debian.binary-package
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package_types: nsis
            artifact: leghub-support-tool-windows-x86_64-setup.exe
            content_type: application/octet-stream

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        # Fest auf 1.95.0: Bei neueren stable-Toolchains ist rust-objcopy auf macOS
        # dynamisch gegen libLLVM.dylib gelinkt, die nicht mitgeliefert wird
        # ("dyld: Library not loaded: @rpath/libLLVM.dylib" in dx bundle).
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Install Dioxus CLI
        run: |
          DX_VERSION="v0.7.9"
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            curl -fL https://github.com/DioxusLabs/dioxus/releases/download/${DX_VERSION}/dx-x86_64-unknown-linux-gnu.tar.gz | tar xz
            sudo mv dx /usr/local/bin/
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            curl -fL https://github.com/DioxusLabs/dioxus/releases/download/${DX_VERSION}/dx-aarch64-apple-darwin.tar.gz | tar xz
            sudo mv dx /usr/local/bin/
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            curl -fL https://github.com/DioxusLabs/dioxus/releases/download/${DX_VERSION}/dx-x86_64-pc-windows-msvc.zip -o dx.zip
            unzip dx.zip
            mv dx.exe C:/Windows/System32/
          fi
        shell: bash

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev
        shell: bash

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Bundle with Dioxus CLI
        # dx bundle (unlike dx build) does platform packaging and embeds the app
        # icon from [bundle] icon in Dioxus.toml — the .icns into the macOS .app,
        # the .ico into the Windows installer/exe, and a .desktop + icon into the
        # Linux .deb. No manual icon handling needed.
        run: dx bundle --release --platform desktop --package leghub-support-tool --package-types ${{ matrix.package_types }}
        shell: bash

      - name: Sign macOS app (ad-hoc)
        if: startsWith(matrix.os, 'macos')
        run: |
          # Ad-hoc sign the bundled .app to prevent the "damaged" Gatekeeper message.
          APP=$(find target/dx/leghub-support-tool/bundle -ipath '*macos*' -name '*.app' | head -1)
          codesign --force --deep --sign - "$APP"
        shell: bash

      - name: Prepare artifact
        run: |
          mkdir -p release-artifacts
          if [[ "${{ matrix.os }}" == macos* ]]; then
            # Build a drag-to-Applications .dmg from the signed .app.
            APP=$(find target/dx/leghub-support-tool/bundle -ipath '*macos*' -name '*.app' | head -1)
            STAGING=$(mktemp -d)
            cp -R "$APP" "$STAGING/"
            ln -s /Applications "$STAGING/Applications"
            hdiutil create -volname "LegHub Support-Tool" -srcfolder "$STAGING" -ov -format UDZO \
              "release-artifacts/${{ matrix.artifact }}"
          elif [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            cp "$(find target/dx/leghub-support-tool/bundle -ipath '*deb*' -name '*.deb' | head -1)" "release-artifacts/${{ matrix.artifact }}"
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            cp "$(find target/dx/leghub-support-tool/bundle -ipath '*nsis*' -name '*.exe' | head -1)" "release-artifacts/${{ matrix.artifact }}"
          fi
        shell: bash

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./release-artifacts/${{ matrix.artifact }}
          asset_name: ${{ matrix.artifact }}
          asset_content_type: ${{ matrix.content_type }}
