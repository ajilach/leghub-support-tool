[package]
name = "leghub-support-tool"
version = "0.1.4"
edition = "2021"

[dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"

[profile.release]
opt-level = "z"
lto = true
strip = true
